name: Publish to GitHub Pages

# Renders the capstone report + slide deck and deploys them to GitHub Pages.
# This runs entirely in CI and commits nothing back to the repo, so the repo
# stays code-only and the separate Posit Connect deployment is unaffected.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Permissions the deploy-pages action needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes supersede in-flight ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # install precompiled binaries -> fast, no source builds

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::Lahman
            any::tidyverse
            any::FactoMineR
            any::factoextra
            any::plotly
            any::broom
            any::kableExtra

      - name: Render site
        run: Rscript render-site.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
